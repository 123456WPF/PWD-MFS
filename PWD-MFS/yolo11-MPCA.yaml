# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs,保留MPCA注意力机制，使用原生检测头
# 适用于需要增强特征聚合能力的目标检测任务

# 模型参数配置
nc: 80  # 类别数量（默认COCO数据集80类，可根据实际任务修改）
scales:  # 模型尺度缩放参数 [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano尺度
  s: [0.50, 0.50, 1024]  # small尺度
  m: [0.50, 1.00, 512]   # medium尺度
  l: [1.00, 1.00, 512]   # large尺度
  x: [1.00, 1.50, 512]   # xlarge尺度

# 主干网络（含MPCA注意力机制）
backbone:
  # [from, repeats, module, args] 解释：
  # from: 输入来源（-1表示上一层，其他数字表示对应层索引）
  # repeats: 模块重复次数
  # module: 模块名称（如Conv、C2f等）
  # args: 模块参数（如输出通道数、卷积核大小等）
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P2/4（输入图像4倍下采样，输出64通道）
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P3/8（8倍下采样，输出128通道）
  - [-1, 3, C2f, [128, True]]  # 2（C2f残差模块，3次重复，带 shortcut）

  - [-1, 1, Conv, [256, 3, 2]]  # 3-P4/16（16倍下采样，输出256通道）
  - [-1, 6, C2f, [256, True]]  # 4（C2f模块，6次重复）

  - [-1, 1, Conv, [512, 3, 2]]  # 5-P5/32（32倍下采样，输出512通道）
  - [-1, 6, C2f, [512, True]]  # 6（C2f模块，6次重复）
  - [-1, 3, C2f, [512, True]]  # 7（C2f模块，3次重复）
  - [-1, 1, SPPF, [512, 5]]  # 8（SPPF特征聚合，核大小5）
  - [-1, 2, C2PSA, [512]]  # 9（C2PSA注意力模块，2次重复）
  - [-1, 1, MPCA, []]  # 10（保留MPCA多路径上下文聚合注意力机制）

# 检测头部（使用YOLO11原生Detect头，移除LSCD）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11（上采样2倍，与P4特征对齐）
  - [[-1, 4], 1, Concat, [1]]  # 12（融合上采样特征与主干P4特征，通道维度拼接）
  - [-1, 2, C3k2, [256, False]]  # 13（C3k2模块细化特征，无shortcut）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14（上采样2倍，与P3特征对齐）
  - [[-1, 2], 1, Concat, [1]]  # 15（融合上采样特征与主干P3特征）
  - [-1, 2, C3k2, [128, False]]  # 16（P3/8-small分支输出，负责小目标检测）

  - [-1, 1, Conv, [128, 3, 2]]  # 17（下采样2倍，与P4头部特征对齐）
  - [[-1, 13], 1, Concat, [1]]  # 18（融合下采样特征与头部P4特征）
  - [-1, 2, C3k2, [256, False]]  # 19（P4/16-medium分支输出，负责中目标检测）

  - [-1, 1, Conv, [256, 3, 2]]  # 20（下采样2倍，与P5特征对齐）
  - [[-1, 10], 1, Concat, [1]]  # 21（融合下采样特征与主干MPCA输出特征）
  - [-1, 2, C3k2, [512, True]]  # 22（P5/32-large分支输出，负责大目标检测）

  - [[16, 19, 22], 1, Detect, [nc]]  # 23（YOLO11原生检测头，融合P3/P4/P5多尺度特征）