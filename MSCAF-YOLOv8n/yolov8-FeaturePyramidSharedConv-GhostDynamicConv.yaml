# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 改进版：融合GhostDynamicConv与FeaturePyramidSharedConv
# 兼具轻量化动态卷积和特征金字塔共享卷积优势，P3-P5输出，适用于目标检测任务
# 使用示例参考：https://docs.ultralytics.com/tasks/detect

# 参数配置
nc: 80  # 类别数量，默认COCO数据集80类
scales:  # 模型复合缩放系数，对应不同尺寸模型（n/s/m/l/x）
  # [depth深度, width宽度, max_channels最大通道数]
  n: [0.33, 0.25, 1024]  # YOLOv8n: 225层, 3.16M参数, 8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s: 225层, 11.17M参数, 28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m: 295层, 25.90M参数, 79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l: 365层, 43.69M参数, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x: 365层, 68.23M参数, 258.5 GFLOPs

# 主干网络：融合C2f_GhostDynamicConv轻量化模块
backbone:
  # 结构说明：[from输入源, repeats重复次数, module模块名, args参数]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2，基础卷积下采样
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4，下采样至4倍
  - [-1, 3, C2f_GhostDynamicConv, [128, True]]  # 2，轻量化动态卷积C2f模块
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8，下采样至8倍
  - [-1, 6, C2f_GhostDynamicConv, [256, True]]  # 4，增强特征提取
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16，下采样至16倍
  - [-1, 6, C2f_GhostDynamicConv, [512, True]]  # 6，深度特征提取
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32，下采样至32倍
  - [-1, 3, C2f_GhostDynamicConv, [1024, True]] # 8，高层特征增强
  - [-1, 1, FeaturePyramidSharedConv, [1024]]   # 9，特征金字塔共享卷积，优化多尺度特征

# 检测头：保持多尺度融合，延续轻量化模块设计
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10，上采样2倍
  - [[-1, 6], 1, Concat, [1]]                   # 11，拼接P4特征（来自backbone第6层）
  - [-1, 3, C2f_GhostDynamicConv, [512]]        # 12，轻量化特征融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13，再次上采样2倍
  - [[-1, 4], 1, Concat, [1]]                   # 14，拼接P3特征（来自backbone第4层）
  - [-1, 3, C2f_GhostDynamicConv, [256]]        # 15 (P3/8-small)，小尺度检测分支
  - [-1, 1, Conv, [256, 3, 2]]                  # 16，下采样2倍
  - [[-1, 12], 1, Concat, [1]]                  # 17，拼接P4特征（来自head第12层）
  - [-1, 3, C2f_GhostDynamicConv, [512]]        # 18 (P4/16-medium)，中尺度检测分支
  - [-1, 1, Conv, [512, 3, 2]]                  # 19，下采样2倍
  - [[-1, 9], 1, Concat, [1]]                   # 20，拼接P5特征（来自backbone第9层）
  - [-1, 3, C2f_GhostDynamicConv, [1024]]       # 21 (P5/32-large)，大尺度检测分支
  - [[15, 18, 21], 1, Detect, [nc]]             # 22，检测头（融合P3/P4/P5多尺度特征）